name: KoriaKrebbs
version: 1.0.0
main: fr.koriamc.krebbs.KoriaKrebbs
author: KoriaMC
description: "Outils Krebbs à 20 niveaux (XP, récompenses, menu) pour KoriaMC (Spigot 1.8.8)"
softdepend: [Vault]

# La commande principale (/krebbs par défaut) et ses alias sont enregistrés dynamiquement
# depuis config.json : ils ne sont donc pas déclarés ici.

permissions:
  koriakrebbs.*:
    description: Accès complet à KoriaKrebbs
    default: op
    children:
      koriakrebbs.player: true
      koriakrebbs.admin: true
  koriakrebbs.player:
    description: Commandes joueur (les nœuds exacts sont définis dans config.json)
    default: true
  koriakrebbs.admin:
    description: Commandes d'administration (les nœuds exacts sont définis dans config.json)
    default: op
